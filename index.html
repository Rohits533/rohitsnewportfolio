<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00FF41">
    <meta name="description" content="Ronit's Portfolio - Enter the Neon Cyberpunk Experience">
    <title>Ronit | Enter the Neon Experience</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ==============================================
           RESET & BASE
           ============================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
            user-select: none;
        }
        
        /* ==============================================
           ANIMATED CURSOR
           ============================================== */
        .custom-cursor {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
            mix-blend-mode: difference;
        }
        
        .cursor-dot {
            width: 8px;
            height: 8px;
            background: #00FF41;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.8), 0 0 40px rgba(0, 255, 65, 0.4);
            transition: width 0.2s, height 0.2s;
        }
        
        .cursor-ring {
            width: 40px;
            height: 40px;
            border: 2px solid #00FF41;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }
        
        .cursor-trail {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.6;
        }
        
        .cursor-glow {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.15), transparent 70%);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.5s;
        }
        
        .cursor-particles {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        
        .cursor-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00FF41;
            border-radius: 50%;
            animation: particleFloat 1s ease-out forwards;
        }
        
        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
        
        /* Cursor States */
        .custom-cursor.hover .cursor-dot {
            width: 12px;
            height: 12px;
            background: #FFD700;
        }
        
        .custom-cursor.hover .cursor-ring {
            width: 60px;
            height: 60px;
            border-color: #FFD700;
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
        }
        
        .custom-cursor.click .cursor-dot {
            width: 4px;
            height: 4px;
            background: #FF00FF;
        }
        
        .custom-cursor.click .cursor-ring {
            width: 80px;
            height: 80px;
            border-color: #FF00FF;
            transform: translate(-50%, -50%) scale(1.5);
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.4);
        }
        
        .custom-cursor.click .cursor-glow {
            background: radial-gradient(circle, rgba(255, 0, 255, 0.3), transparent 70%);
        }
        
        /* ==============================================
           ENTRY PAGE
           ============================================== */
        #entryPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99998;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 1.8s cubic-bezier(0.77, 0, 0.18, 1);
        }
        
        #entryPage.exit {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.1);
        }
        
        #entryPage.exit .entry-content {
            transform: translateY(-50px) scale(0.9);
            opacity: 0;
        }
        
        /* ===== BACKGROUND EFFECTS ===== */
        .entry-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #entryCanvas {
            width: 100%;
            height: 100%;
            opacity: 0.6;
        }
        
        .entry-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridPulse 4s ease-in-out infinite;
        }
        
        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .entry-scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            pointer-events: none;
        }
        
        .entry-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, #0a0a0a 100%);
            pointer-events: none;
        }
        
        .entry-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            animation: noiseMove 0.3s steps(5) infinite;
        }
        
        @keyframes noiseMove {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-5%, -5%); }
            40% { transform: translate(5%, -5%); }
            60% { transform: translate(-5%, 5%); }
            80% { transform: translate(5%, 5%); }
            100% { transform: translate(0, 0); }
        }
        
        /* Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 8s ease-in-out infinite;
        }
        
        .glow-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #00FF41;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .glow-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #FFD700;
            bottom: -50px;
            left: -50px;
            animation-delay: -3s;
        }
        
        .glow-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #FF00FF;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }
        
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.2); }
            66% { transform: translate(-20px, 20px) scale(0.8); }
        }
        
        /* ===== ENTRY CONTENT ===== */
        .entry-content {
            position: relative;
            z-index: 2;
            text-align: center;
            transition: all 1s cubic-bezier(0.77, 0, 0.18, 1);
        }
        
        /* Glitch Text */
        .entry-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }
        
        .entry-title .glitch-text {
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, #00FF41, #FFD700, #00FF41, #FF00FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(0, 255, 65, 0.3));
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .entry-title .glitch-text::before,
        .entry-title .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-text-fill-color: initial;
        }
        
        .entry-title .glitch-text::before {
            color: #FF00FF;
            animation: glitch1 2s infinite;
            clip-path: inset(20% 0 60% 0);
            -webkit-text-fill-color: initial;
        }
        
        .entry-title .glitch-text::after {
            color: #00D4FF;
            animation: glitch2 2.5s infinite;
            clip-path: inset(60% 0 20% 0);
            -webkit-text-fill-color: initial;
        }
        
        @keyframes glitch1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
        }
        
        @keyframes glitch2 {
            0%, 100% { transform: translate(0); }
            30% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            70% { transform: translate(2px, 2px); }
            90% { transform: translate(-2px, -2px); }
        }
        
        .entry-subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #b0b0b0;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.8;
            animation: fadeInUp 1.5s ease 0.5s both;
        }
        
        .entry-subtitle span {
            color: #00FF41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }
        
        /* ===== ENTER BUTTON ===== */
        .enter-btn {
            position: relative;
            padding: 20px 60px;
            font-family: 'Orbitron', monospace;
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            font-weight: 700;
            color: #00FF41;
            background: transparent;
            border: 2px solid #00FF41;
            border-radius: 50px;
            cursor: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1.5s ease 1s both;
        }
        
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.2), transparent);
            transition: all 0.6s;
        }
        
        .enter-btn:hover::before {
            left: 100%;
        }
        
        .enter-btn:hover {
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.3), inset 0 0 40px rgba(0, 255, 65, 0.1);
            transform: translateY(-3px) scale(1.02);
            color: #fff;
            border-color: #FFD700;
        }
        
        .enter-btn:active {
            transform: scale(0.95);
        }
        
        .enter-btn .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .enter-btn .btn-icon {
            display: inline-block;
            transition: all 0.4s;
        }
        
        .enter-btn:hover .btn-icon {
            transform: translateX(5px) rotate(-45deg);
            color: #FFD700;
        }
        
        /* Button Glow Rings */
        .enter-btn .btn-glow-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: ringPulse 2s ease-in-out infinite;
        }
        
        .enter-btn .btn-glow-ring:nth-child(2) {
            width: 100px;
            height: 100px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            top: -30px;
            right: -30px;
            animation-delay: 0s;
        }
        
        .enter-btn .btn-glow-ring:nth-child(3) {
            width: 80px;
            height: 80px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            bottom: -20px;
            left: -20px;
            animation-delay: 1s;
        }
        
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }
        
        /* ===== ENTRY FOOTER ===== */
        .entry-footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 2;
            animation: fadeInUp 1.5s ease 1.5s both;
        }
        
        .entry-footer span {
            color: #00FF41;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* ==============================================
           ANIMATIONS
           ============================================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* ==============================================
           RESPONSIVE
           ============================================== */
        @media (max-width: 768px) {
            .entry-title {
                font-size: clamp(2rem, 8vw, 4rem);
            }
            
            .enter-btn {
                padding: 15px 40px;
                font-size: 1rem;
            }
            
            .entry-subtitle {
                font-size: 0.8rem;
                letter-spacing: 4px;
            }
            
            .glow-orb {
                filter: blur(40px);
            }
            
            .glow-orb:nth-child(1) {
                width: 200px;
                height: 200px;
            }
            
            .glow-orb:nth-child(2) {
                width: 150px;
                height: 150px;
            }
            
            .glow-orb:nth-child(3) {
                width: 120px;
                height: 120px;
            }
        }
        
        @media (max-width: 480px) {
            .entry-title {
                font-size: 2rem;
            }
            
            .enter-btn {
                padding: 12px 30px;
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
            
            .entry-footer {
                font-size: 10px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================== -->
    <!-- ANIMATED CURSOR -->
    <!-- ============================================== -->
    <div class="custom-cursor" id="customCursor">
        <div class="cursor-glow" id="cursorGlow"></div>
        <div class="cursor-ring" id="cursorRing"></div>
        <div class="cursor-dot" id="cursorDot"></div>
        <div class="cursor-particles" id="cursorParticles"></div>
    </div>

    <!-- ============================================== -->
    <!-- ENTRY PAGE -->
    <!-- ============================================== -->
    <div id="entryPage">
        <!-- Background Effects -->
        <div class="entry-bg">
            <canvas id="entryCanvas"></canvas>
            <div class="entry-grid"></div>
            <div class="entry-scanline"></div>
            <div class="entry-vignette"></div>
            <div class="entry-noise"></div>
            <div class="glow-orb"></div>
            <div class="glow-orb"></div>
            <div class="glow-orb"></div>
        </div>

        <!-- Content -->
        <div class="entry-content">
            <h1 class="entry-title">
                <span class="glitch-text" data-text="RONIT">RONIT</span>
            </h1>
            <p class="entry-subtitle">
                <span>✦</span> Enter the Neon Experience <span>✦</span>
            </p>

            <!-- ENTER BUTTON -->
            <button class="enter-btn" id="enterBtn">
                <span class="btn-glow-ring"></span>
                <span class="btn-glow-ring"></span>
                <span class="btn-text">
                    <span>Click to Enter</span>
                    <span class="btn-icon"><i class="fas fa-arrow-right"></i></span>
                </span>
            </button>
        </div>

        <!-- Footer -->
        <div class="entry-footer">
            <span>◆</span> Built with <span>❤</span> by Ronit <span>◆</span>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- MAIN CONTENT (Hidden until enter) -->
    <!-- ============================================== -->
    <div id="mainContent" style="display: none; opacity: 0; transition: opacity 1s;">
        <!-- Your main portfolio content goes here -->
        <!-- This is where your existing HTML goes -->
    </div>

    <!-- ============================================== -->
    <!-- SCRIPTS -->
    <!-- ============================================== -->
    <script>
        // ==============================================
        // ANIMATED CURSOR
        // ==============================================
        class AnimatedCursor {
            constructor() {
                this.cursor = document.getElementById('customCursor');
                this.dot = document.getElementById('cursorDot');
                this.ring = document.getElementById('cursorRing');
                this.glow = document.getElementById('cursorGlow');
                this.particles = document.getElementById('cursorParticles');
                
                this.x = 0;
                this.y = 0;
                this.targetX = 0;
                this.targetY = 0;
                this.ringX = 0;
                this.ringY = 0;
                this.speed = 0.15;
                this.ringSpeed = 0.08;
                this.isHover = false;
                this.isClick = false;
                this.trailPositions = [];
                this.maxTrail = 8;
                
                this.init();
            }
            
            init() {
                // Mouse move
                document.addEventListener('mousemove', (e) => {
                    this.targetX = e.clientX;
                    this.targetY = e.clientY;
                    this.createTrail(e.clientX, e.clientY);
                    
                    // Update cursor position immediately for dot
                    this.x = e.clientX;
                    this.y = e.clientY;
                    this.dot.style.left = e.clientX + 'px';
                    this.dot.style.top = e.clientY + 'px';
                    this.glow.style.left = e.clientX + 'px';
                    this.glow.style.top = e.clientY + 'px';
                });
                
                // Mouse down/up for click effect
                document.addEventListener('mousedown', () => {
                    this.isClick = true;
                    this.cursor.classList.add('click');
                    
                    // Spawn click particles
                    this.spawnParticles(this.x, this.y, 15);
                    
                    setTimeout(() => {
                        this.isClick = false;
                        this.cursor.classList.remove('click');
                    }, 300);
                });
                
                document.addEventListener('mouseup', () => {
                    this.isClick = false;
                    this.cursor.classList.remove('click');
                });
                
                // Hover detection
                document.querySelectorAll('a, button, .clickable, .enter-btn').forEach(el => {
                    el.addEventListener('mouseenter', () => {
                        this.isHover = true;
                        this.cursor.classList.add('hover');
                    });
                    el.addEventListener('mouseleave', () => {
                        this.isHover = false;
                        this.cursor.classList.remove('hover');
                    });
                });
                
                // Handle cursor leaving window
                document.addEventListener('mouseleave', () => {
                    this.cursor.style.opacity = '0';
                });
                
                document.addEventListener('mouseenter', () => {
                    this.cursor.style.opacity = '1';
                });
                
                // Start animation loop
                this.animate();
            }
            
            createTrail(x, y) {
                this.trailPositions.push({ x, y, life: 1 });
                if (this.trailPositions.length > this.maxTrail) {
                    this.trailPositions.shift();
                }
                
                // Update trail elements
                const trails = this.cursor.querySelectorAll('.cursor-trail');
                trails.forEach((trail, index) => {
                    const pos = this.trailPositions[index];
                    if (pos) {
                        trail.style.left = pos.x + 'px';
                        trail.style.top = pos.y + 'px';
                        trail.style.opacity = pos.life * 0.6;
                    }
                });
            }
            
            spawnParticles(x, y, count) {
                const container = this.particles;
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'cursor-particle';
                    
                    const angle = (Math.PI * 2 * i) / count;
                    const distance = 30 + Math.random() * 50;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    particle.style.setProperty('--tx', tx + 'px');
                    particle.style.setProperty('--ty', ty + 'px');
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.background = ['#00FF41', '#FFD700', '#FF00FF', '#00D4FF'][
                        Math.floor(Math.random() * 4)
                    ];
                    particle.style.width = (2 + Math.random() * 4) + 'px';
                    particle.style.height = particle.style.width;
                    
                    container.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.remove();
                    }, 1000);
                }
            }
            
            animate() {
                // Smooth ring follow
                this.ringX += (this.targetX - this.ringX) * this.ringSpeed;
                this.ringY += (this.targetY - this.ringY) * this.ringSpeed;
                
                this.ring.style.left = this.ringX + 'px';
                this.ring.style.top = this.ringY + 'px';
                
                // Update trail positions
                const trails = this.cursor.querySelectorAll('.cursor-trail');
                this.trailPositions.forEach((pos, index) => {
                    if (trails[index]) {
                        trails[index].style.left = pos.x + 'px';
                        trails[index].style.top = pos.y + 'px';
                        pos.life *= 0.98;
                    }
                });
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // ==============================================
        // ENTRY PAGE BACKGROUND (Particles)
        // ==============================================
        class EntryBackground {
            constructor() {
                this.canvas = document.getElementById('entryCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.count = 80;
                this.mouseX = null;
                this.mouseY = null;
                
                this.resize();
                this.initParticles();
                this.animate();
                
                // Track mouse
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                window.addEventListener('resize', () => this.resize());
            }
            
            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }
            
            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.count; i++) {
                    this.particles.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        radius: 1 + Math.random() * 2,
                        alpha: 0.3 + Math.random() * 0.5,
                        baseAlpha: 0.3 + Math.random() * 0.5
                    });
                }
            }
            
            animate() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                this.particles.forEach(p => {
                    // Move
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    // Bounce
                    if (p.x < 0 || p.x > this.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.height) p.vy *= -1;
                    
                    // Mouse interaction
                    if (this.mouseX !== null && this.mouseY !== null) {
                        const dx = p.x - this.mouseX;
                        const dy = p.y - this.mouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 150) {
                            const angle = Math.atan2(dy, dx);
                            const force = (150 - dist) / 150 * 0.5;
                            p.x += Math.cos(angle) * force;
                            p.y += Math.sin(angle) * force;
                            p.alpha = Math.min(1, p.baseAlpha + 0.5);
                        } else {
                            p.alpha += (p.baseAlpha - p.alpha) * 0.02;
                        }
                    }
                    
                    // Draw
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(0, 255, 65, ${p.alpha})`;
                    this.ctx.fill();
                    
                    // Glow
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
                    gradient.addColorStop(0, `rgba(0, 255, 65, ${p.alpha * 0.2})`);
                    gradient.addColorStop(1, 'rgba(0, 255, 65, 0)');
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                // Draw connections
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 150) {
                            const alpha = (1 - dist / 150) * 0.3;
                            this.ctx.beginPath();
                            this.ctx.moveTo(this.particles[i].x, this.particles[i].y);
                            this.ctx.lineTo(this.particles[j].x, this.particles[j].y);
                            this.ctx.strokeStyle = `rgba(0, 255, 65, ${alpha})`;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.stroke();
                        }
                    }
                }
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // ==============================================
        // ENTER BUTTON LOGIC
        // ==============================================
        class EntryManager {
            constructor() {
                this.entryPage = document.getElementById('entryPage');
                this.mainContent = document.getElementById('mainContent');
                this.enterBtn = document.getElementById('enterBtn');
                this.isEntered = false;
                
                this.enterBtn.addEventListener('click', () => this.enter());
                this.enterBtn.addEventListener('mouseenter', () => {
                    // Add hover effect via cursor
                });
                
                // Keyboard support
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.enter();
                    }
                });
            }
            
            enter() {
                if (this.isEntered) return;
                this.isEntered = true;
                
                // Add exit class to entry page
                this.entryPage.classList.add('exit');
                
                // Show main content after transition
                setTimeout(() => {
                    this.mainContent.style.display = 'block';
                    // Trigger reflow
                    this.mainContent.offsetHeight;
                    this.mainContent.style.opacity = '1';
                    
                    // Hide entry page completely
                    setTimeout(() => {
                        this.entryPage.style.display = 'none';
                    }, 500);
                }, 800);
                
                // Play sound effect (optional)
                // this.playEnterSound();
            }
            
            playEnterSound() {
                // Optional: Add a sound effect here
                // const audio = new Audio('assets/sounds/enter.mp3');
                // audio.play();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {

            const cursor = new AnimatedCursor();

            const bg = new EntryBackground();

                cursorEl.appendChild(trail);

            console.log('🚀 Entry page initialized!');
            console.log('💡 Click the button or press Enter to begin');
        });
